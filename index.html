<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>马达 · 每月演出行程</title>
  <style>
    :root {
      --bg: #eef2f6;
      --card: rgba(255,255,255,.78);
      --line: rgba(15, 23, 42, .08);
      --text: #0f172a;
      --muted: #5b6472;
      --accent: #111827;
      --accent-soft: rgba(17,24,39,.08);
      --host: #e8f0ff;
      --standup: #eef7ea;
      --other: #f7f0ff;
      --shadow: 0 18px 60px rgba(15,23,42,.10);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.95) 0, rgba(255,255,255,.55) 30%, transparent 48%),
        linear-gradient(180deg, #f3f6f9 0%, #e8edf3 100%);
      min-height: 100vh;
      padding: 28px;
    }
    .poster {
      max-width: 1440px;
      margin: 0 auto;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.65);
      backdrop-filter: blur(16px);
      border-radius: 36px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0f172a, #64748b);
      box-shadow: 0 0 0 6px rgba(15,23,42,.06);
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      background: white;
      color: var(--text);
      font: inherit;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--line);
      transition: .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.active { background: var(--accent); color: white; border-color: var(--accent); }
    .hero {
      display: grid;
      grid-template-columns: 1.2fr .9fr;
      gap: 16px;
      padding: 16px 28px;
      align-items: stretch;
    }
    .hero-card, .schedule, .info-panel {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius-xl);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .hero-card {
      padding: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      right: -80px;
      top: -100px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(17,24,39,.09), transparent 60%);
    }
    .month {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(17,24,39,.05);
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
      width: fit-content;
    }
    h1 {
      font-size: clamp(28px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -.04em;
      margin: 0 0 12px;
    }
    .subtitle {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 720px;
      margin: 0 0 16px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: auto;
    }
    .stat {
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
    }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .stat-value { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
    .info-panel {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }
    .portrait-wrap {
      border-radius: 26px;
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #eef2f7 0%, #dfe6ee 100%);
      overflow: hidden;
      display: flex;
      align-items: end;
      justify-content: center;
      position: relative;
    }
    .portrait-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(15,23,42,.06));
      pointer-events: none;
    }
    .portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .contact-card {
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.84);
      border: 1px solid var(--line);
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: auto;
    }
    .mini-content { font-size: 14px; line-height: 1.5; color: var(--muted); text-align: center; }
    .main { padding: 0 28px 28px; }
    .schedule { padding: 20px; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
      padding: 4px 4px 0;
    }
    .section-head h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.03em;
    }
    .section-head p { margin: 6px 0 0; color: var(--muted); }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; }
    .legend-item {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--text);
      border: 1px solid var(--line);
      background: white;
    }
    .events {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .event {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 16px;
      padding: 18px;
      padding-left: 22px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      min-height: 138px;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .event:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(15,23,42,.12);
      background: rgba(255,255,255,1);
    }
    .event.type-主持 { border-left: 5px solid #8bb8e0; }
    .event.type-单口 { border-left: 5px solid #a0d898; }
    .event.type-其他 { border-left: 5px solid #c8a8e8; }
    .event-date {
      border-right: 1px solid var(--line);
      padding-right: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
    }
    .date-big { font-size: 28px; font-weight: 700; letter-spacing: -.05em; }
    .date-small { color: var(--muted); font-size: 13px; }
    .time {
      display: inline-flex;
      width: fit-content;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15,23,42,.06);
      color: var(--text);
    }
    .event-title { font-size: 18px; line-height: 1.35; font-weight: 700; margin-bottom: 12px; }
    .meta { display: grid; gap: 7px; color: var(--muted); font-size: 14px; }
    .type-pill {
      margin-top: 14px;
      display: inline-flex;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    .type-pill.type-主持 { background: var(--host); }
    .type-pill.type-单口 { background: var(--standup); }
    .type-pill.type-其他 { background: var(--other); }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 0 28px 26px;
      color: var(--muted);
      font-size: 13px;
    }
    .hidden { display: none !important; }

    @media (max-width: 1100px) {
      .hero { grid-template-columns: 1fr; gap: 0; padding: 16px; }
      .events { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .info-panel { display: none; }
      .hero-card { padding: 16px; }
      .portrait-wrap { display: none; }
      .subtitle { display: none; }
      .chips { display: none; }
    }
    @media (max-width: 780px) {
      body { padding: 8px; }
      .topbar { padding: 8px 12px; }
      .hero { padding: 10px 12px; }
      .hero-card { padding: 12px; }
      h1 { font-size: 28px; margin-bottom: 6px; }
      .month { margin-bottom: 8px; padding: 6px 10px; font-size: 12px; }
      .stats { display: none; }
      .main { padding: 0 12px 12px; }
      .section-head h2 { font-size: 20px; }
      .event { padding: 12px; min-height: auto; }
    }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { padding: 0; background: #f8f9fa; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
      .poster { box-shadow: none; border: 0; border-radius: 0; max-width: 100%; background: white; overflow: visible; padding: 0; }
      .topbar { display: none; }
      .hero { display: block; padding: 40px 40px 20px; }
      .hero-card { background: white; border: 0; border-radius: 0; box-shadow: none; padding: 0 0 24px; }
      .month { display: none; }
      h1 { font-size: 48px; margin-bottom: 8px; letter-spacing: -.03em; }
      .subtitle { display: none; }
      .chips { display: none; }
      .stats { display: none; }
      .info-panel { display: none; }
      .main { padding: 0 40px 40px; }
      .schedule { background: white; border: 0; border-radius: 0; box-shadow: none; padding: 0; }
      .section-head { display: none; }
      .legend { display: none; }
      .events { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .event { border: 0; border-left: 4px solid; border-radius: 0; border-bottom: 1px solid #eee; background: white; min-height: auto; padding: 12px 12px 12px 16px; }
      .event-date { padding: 0; border: 0; display: flex; flex-direction: row; align-items: center; gap: 8px; min-height: auto; }
      .date-big { font-size: 20px; font-weight: 700; }
      .date-small { font-size: 12px; color: #888; }
      .time { background: none; padding: 0; font-size: 12px; color: #666; border-radius: 0; }
      .event-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
      .meta { display: none; }
      .type-pill { margin-top: 6px; font-size: 11px; padding: 4px 8px; }
      .footer { display: none; }
      .event.type-主持 { border-left-color: #8bb8e0; }
      .event.type-单口 { border-left-color: #a0d898; }
      .event.type-其他 { border-left-color: #c8a8e8; }
    }
  </style>
</head>

    const monthOrder = ["全部", "本月", "下个月"];
    let currentMonth = "本月";

    const byId = (id) => document.getElementById(id);
    const brands = [...new Set(config.events.map(item => item.brand))];
    const thisMonth = config.events.filter(i => i.date.startsWith("03"));
    const nextMonth = config.events.filter(i => i.date.startsWith("04"));
    const stats = {
      shows: config.events.length,
      brands: brands.length,
      host: config.events.filter(i => i.type === "主持").length,
      standup: config.events.filter(i => i.type === "单口").length,
    };

    byId('performerName').innerHTML = `${config.performerName}<br/>Monthly Schedule`;
    byId('portraitImg').src = config.portraitUrl;
    byId('monthTag').textContent = config.monthLabel;
    byId('performerIntro').textContent = config.intro;
    byId('statShows').textContent = stats.shows;
    byId('statCities').textContent = stats.brands;
    byId('statHost').textContent = stats.host;
    byId('statStandup').textContent = stats.standup;

              <div class="date-big">${item.date}</div>
              <div class="date-small">${item.weekday}</div>
            </div>
            <div class="time">${item.time}</div>
          </div>
          <div>
            <div class="event-title">${item.title}</div>
            <div class="meta">
              <div>厂牌：${item.brand}</div>
              <div>剧场：${item.venue}</div>
            </div>
            <span class="type-pill type-${item.type}">${item.type}</span>
          </div>
        </article>
      `).join('');
    }

    window.setMonth = (month) => {
      currentMonth = month;
      renderFilters();
      renderEvents();
    };

    renderFilters();
    renderEvents();
  </script>
</body>
</html>
